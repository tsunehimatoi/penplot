name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2022, platform: win, arch: x64 }
          - { os: windows-11-arm, platform: win, arch: arm64 }
          - { os: macos-15-intel, platform: mac, arch: x64 }
          - { os: macos-15, platform: mac, arch: arm64 }
          - { os: ubuntu-22.04, platform: linux, arch: x64 }
          - { os: ubuntu-22.04-arm, platform: linux, arch: arm64 }
    defaults:
      run:
        shell: bash
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      OPENBLAS_NUM_THREADS: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            webui/package-lock.json
            desktop/package-lock.json
      - name: Check release version
        run: |
          python - <<'PY'
          import ast, json, os, pathlib
          tree = ast.parse(pathlib.Path('penplot/__init__.py').read_text(encoding='utf-8'))
          version = next(ast.literal_eval(n.value) for n in tree.body if isinstance(n, ast.Assign) and any(isinstance(t, ast.Name) and t.id == '__version__' for t in n.targets))
          assert json.loads(pathlib.Path('desktop/package.json').read_text())['version'] == version
          assert json.loads(pathlib.Path('desktop/package-lock.json').read_text())['version'] == version
          if os.environ['GITHUB_REF_TYPE'] == 'tag':
              assert os.environ['GITHUB_REF_NAME'] == 'v' + version, 'Tag must match package version'
          PY
      - name: Build frontend
        working-directory: webui
        run: |
          npm ci
          npm run lint
          npm run build
      # cryptography has no wheel for this Windows ARM64 Python ABI.
      - name: Check out vcpkg for Windows ARM64 OpenSSL
        if: matrix.platform == 'win' && matrix.arch == 'arm64'
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: 8f363bdc11359ede4bc51e5eb32a2617538049c8
          path: .ci/vcpkg
      - name: Build Windows ARM64 OpenSSL
        if: matrix.platform == 'win' && matrix.arch == 'arm64'
        shell: pwsh
        run: |
          & .ci/vcpkg/bootstrap-vcpkg.bat -disableMetrics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .ci/vcpkg/vcpkg.exe install openssl:arm64-windows-static-md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "OPENSSL_DIR=$((Resolve-Path .ci/vcpkg/installed/arm64-windows-static-md).Path)" >> $env:GITHUB_ENV
          "OPENSSL_STATIC=1" >> $env:GITHUB_ENV
      # Intel macOS also builds cryptography from source. Static linking avoids
      # colliding with the older libssl bundled with setup-python's interpreter.
      - name: Configure Intel macOS OpenSSL
        if: matrix.platform == 'mac' && matrix.arch == 'x64'
        run: |
          echo "OPENSSL_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
          echo 'OPENSSL_STATIC=1' >> "$GITHUB_ENV"
      - name: Install native generator toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Build backend
        env:
          PENPLOT_BUILD_NATIVE: '1'
        run: |
          python -m pip install --upgrade pip
          python -m pip install '.[all]' 'pyinstaller>=6,<7'
          python -m PyInstaller --noconfirm --clean penplot-backend.spec
          python -m pip wheel --no-deps --wheel-dir dist/wheels .
      - name: Smoke test bundled backend
        env:
          PENPLOT_STATIC_DIR: ${{ github.workspace }}/webui/dist
          PENPLOT_FONT_DIR: ${{ github.workspace }}/fonts
          PENPLOT_DATA_DIR: ${{ runner.temp }}/penplot-smoke
        run: |
          dist/penplot-backend/penplot-backend check
          dist/penplot-backend/penplot-backend dump-openapi --out backend-openapi.json
      - name: Build desktop packages
        working-directory: desktop
        run: |
          npm ci
          npm run dist -- --${{ matrix.platform }} --${{ matrix.arch }} --publish never
      - name: Stage release assets
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          destination = Path('release-assets')
          destination.mkdir(exist_ok=True)
          sources = [p for p in Path('desktop/dist-electron').iterdir()
                     if p.is_file() and p.suffix in ('.exe', '.dmg', '.AppImage', '.deb', '.zip')]
          sources += list(Path('dist/wheels').glob('*.whl'))
          assert sources, 'No release assets were built'
          for source in sources:
              target = destination / source.name
              assert not target.exists(), f'Duplicate release asset: {source.name}'
              shutil.copy2(source, target)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: penplot-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          compression-level: 0
          path: release-assets/*

  publish:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Generate checksums
        working-directory: release
        run: sha256sum * > SHA256SUMS.txt
      - name: Publish all packages together
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Penplot $RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" release/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false
